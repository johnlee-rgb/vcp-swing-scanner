name: Private cloud scan and bounded research
on:
  push:
    branches: [codex/cloud-vnext]
    paths: ['.github/workflows/daily-cloud.yml']
  workflow_dispatch:
    inputs:
      job:
        type: choice
        options: [scan, sec, research]
        default: scan
  schedule:
    # 12:20 Singapore, Tuesday-Saturday; actual XNYS calendar/DST checked by Python.
    - cron: '20 4 * * 2-6'
    - cron: '45 5 * * 6'
permissions:
  contents: read
  id-token: write
concurrency:
  group: vcp-private-cloud
  cancel-in-progress: false
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      VCP_CLOUD_URL: https://vcp-cloud-research.john-lee-5f2.workers.dev
      VCP_CLOUD_TOKEN: ${{ secrets.VCP_CLOUD_WRITE_TOKEN }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      VCP_STATE_ALERTS: '0'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install optional batch research engine
        if: inputs.job == 'research' || github.event.schedule == '45 5 * * 6'
        run: python -m pip install -r requirements-research.txt
      - name: Run saved-data workflow (no notifications)
        env:
          JOB: ${{ inputs.job || (github.event.schedule == '45 5 * * 6' && 'research' || 'scan') }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python -B cloud_job.py scan --tickers EOG,DELL,GLW
          elif [ "$JOB" = "research" ]; then
            for ticker in DELL WDC GLW NVDA; do
              python -B cloud_job.py research --research-ticker "$ticker"
            done
          else
            python -B cloud_job.py "$JOB"
            if [ "$JOB" = "scan" ]; then python -B cloud_job.py sec; fi
          fi
