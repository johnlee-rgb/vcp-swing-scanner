name: Scanner research regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NUMBA_CACHE_DIR: /tmp/vcp-numba
      EDGAR_LOCAL_DATA_DIR: /tmp/vcp-edgar
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-research.txt pytest==9.2.0
      - run: python -m pytest -q
      - run: python -m py_compile app.py cloud_app.py cloud_job.py
      - run: node --test tests/worker_test.mjs
